# Local production-like stack: app + MongoDB (single-node replica set so
# multi-document transactions work exactly like Atlas).
#
#   docker compose up --build
#   → http://127.0.0.1:3000
#
# Optional overrides can be set in .env next to this file:
#   ADMIN_TOKEN, CODEBUDDY_LIVE, CODEBUDDY_API_KEY, MONGODB_DB, SEED_DEMO,
#   MONGO_USER, MONGO_PASSWORD (dev database credentials)
#
# PRD-007: MongoDB enforces authentication. Fresh volumes initialise with the
# root user below; volumes created before auth was added keep working without
# re-auth (credentials are ignored when no users exist) — run
# `docker compose down -v` to re-initialise with auth (destroys dev data).
# Local backend runs/tests outside compose must then point at the authed URI:
#   MONGODB_URI=mongodb://relay:relay-dev-only-change-me@127.0.0.1:27017

services:
  mongo:
    image: mongo:8
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      # PRD-010: loopback-only. Never publish the database to the LAN.
      - '127.0.0.1:27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-relay}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-relay-dev-only-change-me}
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: "mongosh --quiet -u $$MONGO_INITDB_ROOT_USERNAME -p $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'try { rs.status().ok } catch { rs.initiate().ok }' | grep -q 1"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-relay}:${MONGO_PASSWORD:-relay-dev-only-change-me}@mongo:27017
      MONGODB_DB: ${MONGODB_DB:-relay}
      SEED_DEMO: ${SEED_DEMO:-true}
      CODEBUDDY_LIVE: ${CODEBUDDY_LIVE:-false}
      CODEBUDDY_API_KEY: ${CODEBUDDY_API_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      PORT: 3000
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
